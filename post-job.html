<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Skillora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="jobs.css"></head><body class="job-page"><header class="job-nav"><div class="job-nav-inner"><a class="job-brand" href="index.html">Skill<span>ora</span></a><nav class="job-links"><a href="find-jobs.html">Find Jobs</a><a href="post-job.html">Post a Job</a><a href="my-proposals.html">My Proposals</a><a href="profile.html">Dashboard</a></nav><button class="job-menu" id="jobMenu">☰</button></div></header><main class="jobs-wrap"><section class="form-shell"><h1>Post a Job</h1><p>Tell talented freelancers what you need built.</p><form id="postJobForm" class="form-card"><div class="form-grid"><div class="form-group"><label>Job title *</label><input class="field" name="title" placeholder="e.g. Build a React dashboard" required></div><div class="form-group"><label>Category *</label><select class="field" name="category" required><option value="">Choose category</option><option>Web Development</option><option>UI/UX Design</option><option>Writing</option><option>Video Editing</option><option>Digital Marketing</option></select></div><div class="form-group full"><label>Description *</label><textarea class="field" name="description" rows="7" placeholder="Describe the project, deliverables and expectations..." required></textarea></div><div class="form-group"><label>Budget (USD) *</label><input class="field" name="budget" type="number" min="1" placeholder="500" required></div><div class="form-group"><label>Experience *</label><select class="field" name="experience"><option>Beginner</option><option selected>Intermediate</option><option>Expert</option></select></div><div class="form-group"><label>Duration *</label><input class="field" name="duration" placeholder="2-4 weeks" required></div><div class="form-group"><label>Skills *</label><input class="field" name="skills" placeholder="React, CSS, API" required></div></div><div id="formError" class="form-error"></div><button class="primary-btn" type="submit">Publish Job</button></form></section></main><script src="jobs.js"></script></body></html>
